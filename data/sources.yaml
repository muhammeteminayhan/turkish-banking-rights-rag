# Hand-curated list of the documents in the corpus.
# Read by finhak.ingest.sources.load_sources (scripts/fetch_sources.py).
#
# origin: mevzuat (default) or tcmb. A tcmb entry names a listing page on www.tcmb.gov.tr
# and the exact link text of the document there; the PDF URL is read from that page.
#
# mevzuat_no / mevzuat_tur come from mevzuat.gov.tr page URLs:
#   https://www.mevzuat.gov.tr/mevzuat?MevzuatNo={mevzuat_no}&MevzuatTur={mevzuat_tur}&MevzuatTertip=5
#   mevzuat_tur: 1 = Kanun, 7 = Kurum ve Kuruluş Yönetmeliği, 9 = Tebliğ
#
# expected_* values were read from those pages on 2026-10-23; for 19798, 10735 and 38873
# the RG date/number were also cross-checked against the Resmî Gazete daily index
# (resmigazete.gov.tr/eskiler/YYYY/MM/YYYYMMDD.htm). A null value means "not verified":
# the manifest then records whatever the official page says.
# The manifest build fails loudly if a page disagrees with a non-null expected value.
#
# number: the official number of the act ("6502", "2020/7"); yönetmelikler have none.
# issuer: the institution currently responsible for the text.
# status: declared by us; every entry was listed as a current text on mevzuat.gov.tr.

