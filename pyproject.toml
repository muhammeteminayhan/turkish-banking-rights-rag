[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finhak"
version = "0.1.0"
description = "Citation-verified RAG assistant for Turkish banking and consumer finance law"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammet Emin Ayhan" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finhak"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Turkish legal text legitimately contains characters ruff flags as "ambiguous" (ı, –, ’).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Model constructors are type-checked like ordinary functions.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no network, no database",
    "integration: needs a running service such as PostgreSQL",
    "network: hits the real internet (deselected by default in CI)",
    "data: needs the downloaded corpus in data/raw (skipped when it is absent, e.g. in CI)",
]

[tool.coverage.run]
source = ["finhak"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
